<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logs do Container</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css">

</head>
<body>
    <header class="upload-header">
        <div class="container">
            <nav class="d-flex justify-content-between align-items-center">
                <a href="/" class="text-white text-decoration-none fs-5 fw-bold">
                    <i class="bi bi-house-door-fill"></i> Home
                </a>
                <a href="/logout" class="btn btn-outline-light text-decoration-none">
                    <i class="bi bi-box-arrow-right"></i> Sair
                </a>
            </nav>
        </div>
    </header>
</head>
  <div class="container mt-5">
    <div class="text-center mb-4">
      <h1>Logs do Container: {{ container_name }}</h1>
      <a href="/" class="btn btn-success mb-2 text-decoration-none"><i class="bi bi-arrow-left"></i> Voltar </a>
      <pre>{{ logs }}</pre>
    </div>
  </div>
</body>
</html>
