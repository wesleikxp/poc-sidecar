<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>

<body class="bg-light d-flex flex-column min-vh-100">
    <main class="container my-auto">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4"> <div class="card shadow-lg"> <div class="card-header bg-primary text-white text-center py-3"> <h4 class="mb-0">Sidecar Manager</h4> </div>
                    <div class="card-body p-4">
                                <div class="mb-3">
                                </div>
                        <form method="post">
                            <div class="mb-3"> <label for="username" class="form-label">Usuário</label>
                                <div class="input-group"> <span class="input-group-text"><i class="bi bi-person"></i></span> <input type="text" class="form-control" id="username" name="username" placeholder="Seu nome de usuário" required>
                                </div>
                            </div>
                            <div class="mb-4"> <label for="password" class="form-label">Senha</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span> <input type="password" class="form-control" id="password" name="password" placeholder="Sua senha" required>
                                </div>
                            </div>
                            <div class="d-grid gap-2"> <button type="submit" class="btn btn-primary btn-lg">Entrar</button> </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="text-center text-muted py-3"> <p class="mb-0">&copy; Sidecar Manager</p> </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
